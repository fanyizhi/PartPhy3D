[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tactile3d"
version = "0.6.1"
description = "Probabilistic mesh physical grounding, VLM adaptation, and part-level editing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tactile3D Contributors"}]
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "trimesh>=4.0",
  "manifold3d>=3.5.0",
  "fast-simplification>=0.1.9",
  "shapely>=2.0",
  "scipy>=1.10",
  "tqdm>=4.66"
]

[project.optional-dependencies]
vision = ["torch==2.6.0", "torchvision==0.21.0", "open_clip_torch==2.32.0"]
train = [
  "torch==2.6.0",
  "transformers==4.57.6",
  "datasets==3.6.0",
  "accelerate>=1.4,<2",
  "peft==0.17.1",
  "trl==0.29.0",
  "bitsandbytes==0.46.1; platform_system == 'Linux'"
]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.4", "build>=1.2", "setuptools>=68", "wheel>=0.42"]

[project.scripts]
tactile3d = "tactile3d.cli:main"
partphy3d-reproduce = "tactile3d.research.suite:main"
partphy3d-learn = "tactile3d.research.workflow:main"
partphy3d-construct = "tactile3d.research.adaptive_demo:main"
partphy3d-instantmesh = "tactile3d.research.frontend:main"
partphy3d-edit-material = "tactile3d.experiments.bound_material_demo:main"
partphy3d-mesh = "tactile3d.experiments.mesh_native_demo:main"
partphy3d-mesh-learn = "tactile3d.research.native_learning:main"
partphy3d-mesh-reproduce = "tactile3d.research.native_suite:main"
partphy3d-prepare-five = "tactile3d.abo500.subset:main"
partphy3d-check = "tactile3d.utils.preflight:main"

[project.urls]
Repository = "https://github.com/fanyizhi/PartPhy3D"
Documentation = "https://github.com/fanyizhi/PartPhy3D/tree/main/docs"
Issues = "https://github.com/fanyizhi/PartPhy3D/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tactile3d.abo500" = ["licenses/*.txt", "licenses/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

# 外部状态契约统一用ValueError报告非法值，调用方依此处理回滚。
[tool.ruff.lint.per-file-ignores]
"src/tactile3d/eval/import_baseline.py" = ["TRY004"]
"src/tactile3d/physics/edit_program.py" = ["TRY004"]
"src/tactile3d/physics/part_editing.py" = ["TRY004"]
"src/tactile3d/physics/part_state.py" = ["TRY004"]
