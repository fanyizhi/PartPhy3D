name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-cpu:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,figures]"
      - run: python -m ruff check .
      - run: python -m black --check src/tactile3d/physics/material_binding.py src/tactile3d/experiments/bound_material_demo.py src/tactile3d/figures/bound_material.py scripts/edit_material.py tests/test_bound_material.py
      - run: >-
          python -m black --check
          src/tactile3d/physics/mesh_native.py src/tactile3d/physics/mesh_asset_io.py
          src/tactile3d/research/mesh_templates.py src/tactile3d/research/native_learning.py
          src/tactile3d/research/native_suite.py src/tactile3d/experiments/mesh_native_demo.py
          src/tactile3d/figures/mesh_native.py scripts/run_mesh_native.py
          scripts/train_mesh_state.py scripts/reproduce_mesh_native.py
          tests/test_mesh_native.py tests/test_training_split_guard.py
      - run: python -m pytest -q
      - run: >-
          python -m black --check src/tactile3d/vision/part_lifting.py
          scripts/run_part_surface_maps.py scripts/refine_surface_conflicts.py
          scripts/observe_part_points.py scripts/render_surface_maps.py
          scripts/run_nerf_cached_baseline.py scripts/compare_available_baselines.py
          scripts/build_release.py tests/test_part_lifting.py
          src/tactile3d/physics/surface_edit.py tests/test_surface_edit.py
          scripts/run_observed_surface_pipeline.py
      - run: >-
          python -m ruff check --select E501 --line-length 88
          src/tactile3d/vision/part_lifting.py scripts/run_part_surface_maps.py
          scripts/refine_surface_conflicts.py scripts/observe_part_points.py
          scripts/render_surface_maps.py scripts/run_nerf_cached_baseline.py
          scripts/compare_available_baselines.py scripts/build_release.py
          tests/test_part_lifting.py
          src/tactile3d/physics/surface_edit.py tests/test_surface_edit.py
          scripts/run_observed_surface_pipeline.py
      - run: >-
          python scripts/render_surface_maps.py
          --fields examples/observed_surface_demo
          --edit-spec examples/observed_surface_demo/edit_spec.json
          --output outputs/ci-surface-replay
      - run: >-
          python -m black --check
          src/tactile3d/vision/local_vlm.py src/tactile3d/vision/silhouette.py
          src/tactile3d/mesh/frames.py src/tactile3d/research/observed_cameras.py
          src/tactile3d/experiments/local_vlm_pilot.py
          src/tactile3d/figures/vlm_pilot.py
          src/tactile3d/training/train_vlm.py src/tactile3d/training/collator.py
          src/tactile3d/training/preflight.py
          scripts/run_local_vlm_pilot.py scripts/run_observed_instantmesh.py
          scripts/evaluate_observed_mesh.py scripts/render_observed_five.py
          scripts/compare_vlm_pilots.py scripts/audit_abo_frames.py
          scripts/download_model_snapshot.py scripts/smoke_qlora.py
          tests/test_local_vlm_pilot.py tests/test_mesh_frames.py
          tests/test_training_contract.py tests/test_observed_cameras.py
          scripts/prepare_abo_mass_sft.py scripts/evaluate_mass_sft.py
          scripts/summarize_mass_sft.py tests/test_abo_mass_sft.py
      - run: python scripts/check_installation.py
      - run: >-
          python -m black --check scripts/package_server.py scripts/check_installation.py
          src/tactile3d/utils/preflight.py tests/test_installation_contract.py
      - run: >-
          python -m black --check src/tactile3d/abo500/subset.py
          src/tactile3d/experiments/five_object_pilot.py
          scripts/prepare_five_objects.py tests/test_abo_subset.py
      - run: python scripts/edit_parts.py --output outputs/ci-edit
      - run: python scripts/edit_parts.py --plan examples/wood_to_hollow_steel.json --output outputs/ci-program
      - run: python scripts/audit_edit_observability.py --output outputs/ci-observability
      - run: python scripts/reproduce_all.py --output outputs/ci-reproduction
      - run: python scripts/reproduce_mesh_native.py --output outputs/ci-mesh
      - run: python scripts/package_project.py --output outputs/ci-release
      - run: python scripts/package_server.py --output outputs/ci-server-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-edit-demo
          path: |
            outputs/ci-edit
            outputs/ci-program
            outputs/ci-observability
            outputs/ci-reproduction
            outputs/ci-mesh
            outputs/ci-surface-replay
            outputs/ci-release/dist
            outputs/ci-server-bundle/PartPhy3D-with-data.zip
            outputs/ci-server-bundle/PartPhy3D-with-data.zip.sha256
          if-no-files-found: error
          retention-days: 14

  full-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -r requirements.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/check_installation.py --training --frontend
      - run: >-
          python -c "from sam2.build_sam import build_sam2;
          from sam2.sam2_image_predictor import SAM2ImagePredictor"
      - run: python -m pytest -q
